<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>video-Play</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/all.css">
</head>
<style>
    .vdo-card{
        height: 400px;
        -border: 2px solid red;
        width:50% ;
        /* margin: auto;
        margin-top: 100px; */
        

    }
    .box{
        background: url(/imgs/about/abt.jpg) no-repeat center;
        background-size: contain;
    }
    .filter{
        background: #000;
    }
    .play-btn{
        position: absolute;
        top: 40%;
        left: 45%;
        background-color: #F28123;
        color: #051922;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        font-size: 20px;  
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        box-shadow: 0 0 20px #adadad;
    }

    /* .modal-dialog{
        max-width: 800px;
        height: 100vh;
    } */

     /* .modal-content{
        height: 1200px;
        width: 1000px;
     } */

      #video{
        height: 500px;
        width: 1000px;
        
      }
      .center{
        position: absolute;
        top: 20%;
        left: 25%;
      }
</style>
<body>
    <div class="vdo-card border border-danger">
        <div class="box position-relative border border-success h-100">
            <div class="filter h-100 opacity-50" ></div>

            <a class="play-btn " href="#video" data-bs-toggle="modal">
                <i class="fa-solid fa-play"></i> 
            </a>


            <div id="video" class=" modal position-absolute center">
                <div class="modal-dialog modal-fullscreen  ">
                    <div class="modal-content">
                        <div class="modal-body " >
                            <iframe width="970" height="470" src="https://www.youtube.com/embed/DBLlFWYcIGQ?si=m1dPx5wbdyqAXzmj" title="YouTube video player" frameborder="0" allow="autoplay; accelerometer;  clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen ></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>

</body>
</html>
