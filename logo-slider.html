<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logo Slider</title>
  <link rel="stylesheet" href="/css/all.css" />
  <link rel="stylesheet" href="/css/bootstrap.min.css" />
  <style>
    .carousel-item {
      transition: transform 0.8s ease-in-out;
    }
    .logo-group {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 30px;
    }
    #logo .carousel-inner {
      padding: 20px;
    }
    #logo {
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="logo" class="carousel slide m-5 border" data-bs-ride="carousel" data-bs-interval="2500" data-bs-pause="false">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <div class="logo-group">
          <img src="/imgs/logos/1.png" alt="Logo 1" />
          <img src="/imgs/logos/2.png" alt="Logo 2" />
          <img src="/imgs/logos/3.png" alt="Logo 3" />
          <img src="/imgs/logos/4.png" alt="Logo 4" />
        </div>
      </div>
      <div class="carousel-item">
        <div class="logo-group">
          <img src="/imgs/logos/5.png" alt="Logo 5" />
          <img src="/imgs/logos/1.png" alt="Logo 1" />
          <img src="/imgs/logos/2.png" alt="Logo 2" /> 
          <img src="/imgs/logos/3.png" alt="Logo 3" /> 
        </div>
      </div>
      <div class="carousel-item">
        <div class="logo-group">
          <img src="/imgs/logos/3.png" alt="Logo 3" />
          <img src="/imgs/logos/4.png" alt="Logo 4" />
          <img src="/imgs/logos/5.png" alt="Logo 5" />
          <img src="/imgs/logos/1.png" alt="Logo 1" />
        </div>
      </div>
    </div>
  </div>

  <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
